# ============================================================
# 云诊医疗智能问诊系统（CDMIIS）
# Docker Compose 一键编排 4 个数据库服务
# 启动方式：docker compose up -d
# ============================================================

version: "3.8"

services:
  # ----------------------------------------------------------
  # Neo4j 知识图谱
  # Browser: http://localhost:7474
  # Bolt:    bolt://localhost:7687
  # ----------------------------------------------------------
  neo4j:
    image: neo4j:5
    container_name: cdmiis_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt 协议
    environment:
      NEO4J_AUTH: neo4j/cdmiis_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Milvus 向量库（Standalone 模式）
  # gRPC: localhost:19530
  # ----------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: cdmiis_milvus
    restart: unless-stopped
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # Health check
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Milvus 依赖：etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: cdmiis_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Milvus 依赖：MinIO（对象存储）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: cdmiis_minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # RedisStack 短期记忆
  # localhost:6379
  # ----------------------------------------------------------
  redis-stack:
    image: redis/redis-stack:latest
    container_name: cdmiis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------
  # PostgreSQL 长期记忆
  # localhost:5432
  # ----------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: cdmiis_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cdmiis_password
      POSTGRES_DB: cloud_diagnosis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_diagnosis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ============================================================
# 持久化卷
# ============================================================
volumes:
  neo4j_data:
  neo4j_logs:
  milvus_data:
  etcd_data:
  minio_data:
  redis_data:
  postgres_data:
